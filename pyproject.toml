[project]
name = "a2ui-adk"
version = "0.1.0"
description = "Google ADK + A2UI demos (table, components, AG-UI + React)"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115,<1",
    "uvicorn[standard]>=0.30,<1",
    "pydantic>=2.8,<3",
    "python-dotenv>=1,<2",
    "httpx>=0.27,<1",
    "google-adk==2.13.0",
    "ag-ui-adk==0.11.1",
]

[dependency-groups]
dev = ["pytest>=8,<10"]

[tool.uv]
package = false
