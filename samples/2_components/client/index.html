<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>ADK + A2UI v1.0 Demo</title>
<style>
:root{font-family:system-ui,-apple-system,sans-serif;color:#162237;background:#f3f6fa}*{box-sizing:border-box}body{margin:0}main{max-width:880px;margin:35px auto;padding:0 16px}header{margin-bottom:24px}h1{font-size:26px;margin:0 0 6px}p{color:#526175;margin:0}#history{display:flex;flex-direction:column;gap:18px;min-height:270px;margin:24px 0}.message{background:white;border:1px solid #dbe2ec;border-radius:12px;padding:18px;overflow-x:auto}.message.user{background:#e8f0fb;align-self:flex-end;max-width:80%}.content{white-space:pre-wrap;line-height:1.6}.surface{border:1px solid #dce3ec;padding:14px;border-radius:10px;margin-top:14px}.surface h3{margin:0 0 12px;font-size:17px}.surface table{border-collapse:collapse;width:100%;font-size:14px}th,td{padding:9px 10px;border-bottom:1px solid #e6e9ef;text-align:left}th{background:#f3f6f9}form{display:flex;gap:10px}input{flex:1;padding:12px;border:1px solid #c6cfda;border-radius:8px;font-size:15px}button{background:#234ec9;color:white;border:0;border-radius:8px;padding:11px 18px;cursor:pointer}button:disabled{opacity:.5}#status{font-size:12px;margin-top:10px;color:#687789}.error{color:#b21d33}code{background:#f3f3f5;border-radius:4px;padding:1px 3px}strong{font-weight:700}
.metric-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:12px}.metric-tile{background:#f3f6fb;border-radius:8px;padding:18px}.metric-label{font-size:12px;color:#526175}.metric-value{font-size:19px;font-weight:700;margin-top:8px}.chart{display:flex;flex-direction:column;gap:10px}.chart-row{display:grid;grid-template-columns:48px 1fr 120px;align-items:center;gap:12px;font-size:13px}.chart-track{background:#ebeff7;border-radius:6px;height:21px;overflow:hidden}.chart-bar{background:#4978db;height:100%;border-radius:6px}.chart-value{text-align:right}.chart-name{font-weight:600} .examples{font-size:12px;color:#526175;margin-top:12px}
</style></head>
<body><main><header><h1>ADK + A2UI v1.0</h1><p>Streaming Markdown and agent-selected A2UI Table, Card and Chart surfaces, over SSE.</p></header>
<p class="examples">Try: “Vis mine fakturaer” · “Vis faktura KPI overblik” · “Vis omsætning som graf”</p><div id="history" aria-live="polite"></div><form id="form"><input id="prompt" aria-label="Message" value="Vis mine seneste fakturaer" placeholder="Ask about invoices or anything else" required><button id="send" type="submit">Send</button></form><div id="status">Ready · Try “Vis fakturaer”, “Vis KPI overblik”, “Vis omsætning graf”</div></main>
<script type="module" src="/client.js"></script></body></html>
